name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      # Coverage gate — fails if line/branch/function coverage regresses below the thresholds in
      # vitest.config.ts (lines ≥95, branches ≥87, functions ≥96). The committed seeded fuzz
      # (fuzz.test.ts) runs here too.
      - run: pnpm test:coverage

      - run: pnpm build

      # Schema gate — the published JSON Schema must stay in sync with the Zod source (catches the
      # class of bug where the runtime and the contract drift apart).
      - name: JSON Schema is in sync with the Zod source
        run: |
          pnpm gen:schema
          git diff --exit-code packages/core/schema

      # Dogfood gate — the tool is run against this repository's own collections. `--strict` means
      # even a warning fails: if TruSpec's own examples cannot pass TruSpec's linter, the linter is
      # either wrong or the examples are, and both are worth knowing on the commit that caused it.
      - name: Our own example collections pass `truspec lint --strict`
        run: node packages/cli/dist/index.js lint examples --strict

      # Determinism gate — `truspec docs` promises byte-identical output for unchanged files, which
      # is the entire reason its output is committable. This proves it on every push, and keeps the
      # committed example docs in sync with the collections they describe.
      - name: Committed example docs are up to date and deterministic
        run: |
          node packages/cli/dist/index.js docs examples/blog --title "Blog API (example collection)" -o examples/blog/API.md
          node packages/cli/dist/index.js docs examples/petstore --title "Petstore API (example collection)" -o examples/petstore/API.md
          git diff --exit-code examples

  # The engine, CLI and web server all ship cross-platform — the CLI on npm, the web server inside
  # the desktop app's Windows and macOS installers — but every gate above runs only on Linux. Path
  # handling is exactly where that hurts: the workspace confinement guard, the `relative()` output
  # the HTTP API and MCP hand out as identifiers, and file discovery are all separator-sensitive.
  # Run the suite where those differ.
  #
  # Deliberately not the byte-comparison gates (schema and docs `git diff --exit-code`): a CRLF
  # checkout would fail them for reasons that say nothing about the code.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
