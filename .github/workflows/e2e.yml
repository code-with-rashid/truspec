name: E2E

# Browser end-to-end regressions for the web UI — guards the bugs that only a real browser exposes
# (CSRF cross-origin/cross-port, X-Frame-Options, editor keyboard a11y, XSS escaping, axe a11y).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The e2e suite serves the built web client + server, which imports the built @truspec/core,
      # so build the whole graph (turbo orders core before web).
      - run: pnpm build

      # `playwright install --with-deps` runs `apt-get update`, and the hosted runner image ships
      # Google's and Microsoft's apt repositories. Neither provides anything installed here, and
      # when one of their CDNs serves an index whose hash does not match its own Release file,
      # `apt-get update` exits 100 and takes the job with it — which is what happened across five
      # consecutive runs. Drop the lists we do not use.
      - name: Drop unused third-party apt sources
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list

      - name: Install Playwright chromium + OS deps
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
